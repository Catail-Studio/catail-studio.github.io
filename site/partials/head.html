<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7b3cf" />
<link rel="canonical" href="{{url}}" />
<link rel="alternate" hreflang="tr" href="{{url.tr}}" />
<link rel="alternate" hreflang="en" href="{{url.en}}" />
<link rel="alternate" hreflang="x-default" href="{{url.en}}" />
<link rel="icon" href="{{root}}assets/icon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="{{root}}assets/icon-128.png" />
<script>
  // Before the first paint, so a returning visitor doesn't see the wrong cat flash by.
  document.documentElement.classList.add("js");
  try {
    var cat = localStorage.getItem("catail.site.cat");
    if (/^(orange|gray|white|calico|black)$/.test(cat)) document.documentElement.dataset.cat = cat;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap"
/>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Catail Studio" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{url}}" />
<meta property="og:image" content="{{share}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="{{locale}}" />
<meta property="og:locale:alternate" content="{{locale.other}}" />
<meta name="twitter:card" content="summary_large_image" />
{{ld}}
