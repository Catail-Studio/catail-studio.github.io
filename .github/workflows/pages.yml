name: Website

# Publishes public/ to GitHub Pages whenever main changes. Its pages are built from site/
# (npm run build) and committed; the check stops a deploy whose pages don't match their sources.
# The repo's Settings -> Pages -> Source must be set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy still waiting, so the newest site always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pages match their sources
        run: node site/build.mjs --check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
