<!doctype html>
<html lang="tr" data-cat="orange">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- This page answers at any missing address, so every link here starts from the site's root. -->
    <base href="{{base}}" />
    <title>Sayfa bulunamadı · Catail Studio</title>
    <link rel="icon" href="assets/icon-32.png" sizes="32x32" />
    <script>
      document.documentElement.classList.add("js");
      try {
        var cat = localStorage.getItem("catail.site.cat");
        if (/^(orange|gray|white|calico|black)$/.test(cat)) document.documentElement.dataset.cat = cat;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="design.css" />
  </head>
  <body class="ui-page">
    <main class="ui-container ui-hero ui-lost">
      <a class="ui-nav__brand" href="./" aria-label="Catail Studio">
        <img class="logo logo--dark-ink" src="assets/catail-studio.png" alt="Catail Studio" width="176" height="26" />
        <img class="logo logo--light-ink" src="assets/catail-studio-light.png" alt="" width="176" height="26" />
      </a>
      <!-- A cat that bumped its head: it sways, and stars circle round above it. -->
      <span class="ui-dizzy" aria-hidden="true">
        <span class="ui-dizzy__stars">
          <i style="--n: 0"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.6 6 6.4.6-4.9 4.3 1.5 6.3L12 16.4l-5.6 3.3 1.5-6.3L3 9.1l6.4-.6z" /></svg></i>
          <i style="--n: 1"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.6 6 6.4.6-4.9 4.3 1.5 6.3L12 16.4l-5.6 3.3 1.5-6.3L3 9.1l6.4-.6z" /></svg></i>
          <i style="--n: 2"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.6 6 6.4.6-4.9 4.3 1.5 6.3L12 16.4l-5.6 3.3 1.5-6.3L3 9.1l6.4-.6z" /></svg></i>
          <i style="--n: 3"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.6 6 6.4.6-4.9 4.3 1.5 6.3L12 16.4l-5.6 3.3 1.5-6.3L3 9.1l6.4-.6z" /></svg></i>
        </span>
        <span class="cat ui-dizzy__cat"><span class="cat__body"></span><span class="cat__foot cat__foot--left"></span><span class="cat__foot cat__foot--right"></span></span>
      </span>
      <span class="ui-eyebrow">404</span>
      <h1 class="ui-title ui-title--hero">Kedi bu sayfayı bulamadı.</h1>
      <p class="ui-lead" lang="en">The cat couldn't find this page.</p>
      <div class="ui-actions ui-actions--center">
        <a class="ui-button ui-button--primary" href="./">Ana sayfa</a>
        <a class="ui-button ui-button--secondary" href="catail/">Catail</a>
        <a class="ui-button ui-button--secondary" href="en/" lang="en">English</a>
      </div>
    </main>
  </body>
</html>
